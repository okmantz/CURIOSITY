  <title>CURIOSITY: the social feed for your mind</title>
  <meta name="description" content="A TikTok-style vertical feed where every post is an interactive idea: thought experiments, history decisions, paradoxes, debates and more. Free, private, no account.">
  <meta name="theme-color" content="#08080b">

  <meta property="og:title" content="CURIOSITY: scroll to think">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('curiosity.v1') || '{}'), t = (s.prefs && s.prefs.theme) || 'dark';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.prefs && s.prefs.reduceMotion) document.documentElement.dataset.motion = 'reduce';
    } catch (e) {}
  </script>
</head>

  <div id="app" class="app" aria-live="off"></div>
